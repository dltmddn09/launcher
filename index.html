<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>툴 모음</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bar: #2B3A55;
    --bar-text: #FFFFFF;
    --bg: #EEF0F3;
    --panel: #FFFFFF;
    --line: #D5D9E0;
    --line-strong: #B8BFCA;
    --head-bg: #F4F5F7;
    --group-bg: #DDE3EC;
    --text: #222222;
    --sub: #666666;
    --muted: #999999;
    --link: #1F4E9C;
    --hit: #FFF3B0;
  }

  body {
    font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
  }

  .topbar {
    background: var(--bar);
    color: var(--bar-text);
    height: 44px;
    display: flex;
    align-items: center;
    padding: 0 20px;
  }
  .topbar h1 { font-size: 15px; font-weight: bold; }

  .wrap { max-width: 980px; margin: 16px auto; padding: 0 16px; }

  .panel { background: var(--panel); border: 1px solid var(--line); }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  .toolbar label { color: var(--sub); }
  .toolbar input[type=text] {
    width: 260px;
    height: 28px;
    padding: 0 8px;
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    font: inherit;
  }
  .toolbar input[type=text]:focus { outline: none; border-color: var(--bar); }
  .toolbar select {
    height: 28px;
    padding: 0 4px;
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    font: inherit;
    background: #fff;
  }
  .toolbar .count { margin-left: auto; color: var(--sub); }

  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th, td {
    border-bottom: 1px solid var(--line);
    padding: 8px 10px;
    text-align: left;
    vertical-align: middle;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  th { background: var(--head-bg); font-weight: bold; color: #444; border-bottom-color: var(--line-strong); }
  col.c-name { width: 230px; }
  col.c-cycle { width: 100px; }
  col.c-open { width: 96px; }

  tbody tr.row { cursor: pointer; }
  tbody tr.row td { padding: 16px 14px; font-size: 14px; }

  tr.gap td { height: 14px; padding: 0; background: var(--bg); border-bottom: 0; }
  tr.group td {
    background: var(--group-bg);
    border-top: 2px solid var(--bar);
    border-bottom: 1px solid var(--line-strong);
    font-weight: bold;
    color: var(--bar);
    font-size: 14px;
    padding: 9px 14px;
  }
  tr.group .n { margin-left: 6px; font-weight: normal; color: var(--sub); }
  tbody tr.row:hover td { background: #F7F9FC; }
  tbody tr.row.sel td { background: #EAF1FB; }

  tbody tr.row td.name { font-size: 16px; }
  td.name a { color: var(--link); font-weight: bold; text-decoration: none; }
  tr.row:hover td.name a { text-decoration: underline; }
  td.open { text-align: center; }
  .btn-open {
    display: inline-block;
    width: 64px;
    height: 32px;
    line-height: 30px;
    border: 1px solid var(--bar);
    border-radius: 2px;
    background: #fff;
    color: var(--bar);
    font-weight: bold;
    text-align: center;
    text-decoration: none;
  }
  tr.row:hover .btn-open, tr.row.sel .btn-open { background: var(--bar); color: #fff; }
  td.desc { color: var(--text); white-space: normal; }
  td.cycle { color: var(--sub); }
  mark { background: var(--hit); color: inherit; }

  .empty td { text-align: center; color: var(--muted); padding: 24px; }

  .foot { margin-top: 8px; color: var(--muted); font-size: 12px; }

  @media (max-width: 640px) {
    col.c-name { width: 150px; }
    col.c-cycle, th.cycle, td.cycle { display: none; }
    col.c-open { width: 80px; }
    .toolbar { flex-wrap: wrap; }
    .toolbar input[type=text] { width: 100%; }
  }
</style>
</head>
<body>

<div class="topbar"><h1>툴 모음</h1></div>

<div class="wrap">
  <div class="panel">
    <div class="toolbar">
      <label for="q">검색</label>
      <input type="text" id="q" placeholder="툴 이름·설명 ( / 키로 이동 )" autocomplete="off">
      <select id="cat" aria-label="구분"></select>
      <span class="count" id="count"></span>
    </div>
    <table>
      <colgroup><col class="c-name"><col><col class="c-cycle"><col class="c-open"></colgroup>
      <thead><tr><th>툴 이름</th><th>설명</th><th class="cycle">갱신</th><th></th></tr></thead>
      <tbody id="list"></tbody>
    </table>
  </div>
  <p class="foot">검색 후 Enter: 선택된 툴 열기 · ↑↓: 선택 이동</p>
</div>

<script>
// 툴을 추가할 때는 이 목록에 한 줄만 넣으면 된다. 구분이 새 이름이면 그룹이 새로 생긴다.
const TOOLS = [
  { cat: '공지·패치노트', name: '패치노트 변환기', desc: '패치노트 코드 변환', cycle: '', url: 'https://dltmddn09.github.io/ops-tools/patchnote-converter/' },
  { cat: '공지·패치노트', name: '공지 검색', desc: '공식 홈페이지 공지 전문 검색', cycle: '매주 월', url: 'https://dltmddn09.github.io/ops-tools/notice-search/' },
  { cat: '공지·패치노트', name: '공지/dm 툴', desc: '공지 HTML에 번역 표를 붙여 언어별 소스 만들기', cycle: '', url: 'https://mate8787.github.io/tools/notice-converter/' },
  { cat: '번역·자막', name: '다국어 SRT 생성기', desc: '완성된 SRT 하나를 업로드하고, 타언어 SRT 생성하기', cycle: '', url: 'https://dltmddn09.github.io/ops-tools/srt-generator/' },
  { cat: '모니터링·데이터', name: '종토방 모니터링', desc: '종목토론방 화제글·본문 검색', cycle: '2시간', url: 'https://dltmddn09.github.io/launcher/monitor/' },
  { cat: '모니터링·데이터', name: '헤이박스 판매량 계산기', desc: '헤이박스 판매량 확인 및 계산', cycle: '', url: 'https://dltmddn09.github.io/ops-tools/heybox-calculator/' },
];

const $q = document.getElementById('q');
const $cat = document.getElementById('cat');
const $list = document.getElementById('list');
const $count = document.getElementById('count');
let shown = [];
let sel = 0;

const cats = [...new Set(TOOLS.map(t => t.cat))];
$cat.innerHTML = '<option value="">전체 구분</option>' + cats.map(c => `<option>${c}</option>`).join('');

function esc(s) {
  return s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
}
function hl(s, q) {
  if (!q) return esc(s);
  const i = s.toLowerCase().indexOf(q);
  if (i < 0) return esc(s);
  return esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length));
}

function render() {
  const q = $q.value.trim().toLowerCase();
  const c = $cat.value;
  shown = TOOLS.filter(t =>
    (!c || t.cat === c) &&
    (!q || (t.name + ' ' + t.desc).toLowerCase().includes(q))
  );
  if (sel >= shown.length) sel = 0;

  const perCat = {};
  shown.forEach(t => { perCat[t.cat] = (perCat[t.cat] || 0) + 1; });

  let html = '';
  let last = null;
  shown.forEach((t, i) => {
    if (t.cat !== last) {
      if (last !== null) html += '<tr class="gap"><td colspan="4"></td></tr>';
      html += `<tr class="group"><td colspan="4">${esc(t.cat)}<span class="n">${perCat[t.cat]}</span></td></tr>`;
      last = t.cat;
    }
    html += `<tr class="row${q && i === sel ? ' sel' : ''}" data-i="${i}">
      <td class="name"><a href="${esc(t.url)}" target="_blank" rel="noopener">${hl(t.name, q)}</a></td>
      <td class="desc">${hl(t.desc, q)}</td>
      <td class="cycle">${t.cycle ? esc(t.cycle) : '-'}</td>
      <td class="open"><a class="btn-open" href="${esc(t.url)}" target="_blank" rel="noopener">열기</a></td>
    </tr>`;
  });
  $list.innerHTML = html || '<tr class="empty"><td colspan="4">검색 결과가 없습니다.</td></tr>';
  $count.textContent = (q || c) ? `${shown.length} / ${TOOLS.length}개` : `전체 ${TOOLS.length}개`;
}

// 행 아무 곳이나 눌러도 열린다 (링크를 직접 누른 경우는 링크가 처리)
$list.addEventListener('click', e => {
  const tr = e.target.closest('tr.row');
  if (!tr || e.target.closest('a')) return;
  window.open(shown[tr.dataset.i].url, '_blank', 'noopener');
});

$q.addEventListener('input', () => { sel = 0; render(); });
$cat.addEventListener('change', render);
$q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, shown.length - 1); render(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); render(); e.preventDefault(); }
  else if (e.key === 'Enter' && shown[sel]) { window.open(shown[sel].url, '_blank', 'noopener'); }
  else if (e.key === 'Escape') { $q.value = ''; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $q) { e.preventDefault(); $q.focus(); }
});

render();
</script>
</body>
</html>
